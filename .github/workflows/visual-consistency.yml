name: Visual Consistency Tests

# Interface/visual tests against the LIVE deployed beta site (beta.agroverse.shop),
# not localhost or a PR-time build. Triggered after a successful GitHub Pages
# deployment so we test what users actually get. Pulled out of PR CI to keep the
# merge gate fast and to make Playwright a meaningful post-deploy check.

on:
  deployment_status:
  workflow_dispatch:

jobs:
  test:
    name: Visual Consistency (beta.agroverse.shop)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'github-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify sitemap lists all blog posts
        run: npm run sitemap:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against deployed beta
        run: npm test
        env:
          CI: true
          # playwright.config.ts auto-routes to beta.agroverse.shop based on
          # GITHUB_REPOSITORY=TrueSightDAO/agroverse_shop_beta; BASE_URL override
          # is also available if needed.
        timeout-minutes: 20

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-beta
          path: playwright-report/
          retention-days: 30
